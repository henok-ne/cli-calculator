[project]
name = "cli-calculator"
version = "2.0.0"
description = "A clean, user-friendly Python CLI calculator with safe expression evaluation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "cli-calculator contributors" }]
requires-python = ">=3.8"
dependencies = []
keywords = ["calculator", "cli", "repl", "math"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/henok-ne/cli-calculator"
Repository = "https://github.com/henok-ne/cli-calculator"

[project.scripts]
calc = "calc:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = []

[tool.coverage.run]
source = ["calc"]
branch = true

[tool.coverage.report]
omit = ["tests/*"]
